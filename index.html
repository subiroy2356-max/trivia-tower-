<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trivia Tower Rush</title>
    <!-- AdMob Monetization Script -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
    <style>
        :root {
            --bg-color: #0b0d17;
            --card-bg: rgba(22, 27, 46, 0.85);
            --accent-cyan: #00f0ff;
            --accent-magenta: #ff007f;
            --accent-gold: #ffd700;
            --text-main: #f0f4f8;
            --text-muted: #8a99ad;
            --correct-color: #00ff88;
            --wrong-color: #ff3366;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 240, 255, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(255, 0, 127, 0.1) 0%, transparent 20%);
        }

        #app-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 850px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        .screen {
            display: none;
            flex-direction: column;
            height: 100%;
            width: 100%;
            padding: 20px;
            position: absolute;
            top: 0;
            left: 0;
            overflow-y: auto;
        }

        .screen.active {
            display: flex;
        }

        h1, h2, h3 {
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .title-glow {
            font-size: 2.2rem;
            color: #fff;
            text-shadow: 0 0 10px var(--accent-cyan), 0 0 20px var(--accent-cyan);
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--accent-magenta);
            text-align: center;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .btn {
            background: linear-gradient(135deg, var(--accent-cyan), #0088ff);
            color: #000;
            border: none;
            padding: 15px 20px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0, 240, 255, 0.3);
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-gold {
            background: linear-gradient(135deg, var(--accent-gold), #ff9900);
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: none;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .currency-display {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: bold;
            color: var(--accent-gold);
        }

        /* Question Card */
        .question-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            font-size: 1.2rem;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-main);
            padding: 15px;
            border-radius: 10px;
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: background 0.2s;
        }

        .option-btn.correct {
            background: var(--correct-color) !important;
            color: #000 !important;
            font-weight: bold;
        }

        .option-btn.wrong {
            background: var(--wrong-color) !important;
            color: #fff !important;
        }
    </style>
</head>
<body>

<div id="app-container">
    <!-- Main Menu Screen -->
    <div id="menu-screen" class="screen active">
        <h1 class="title-glow" style="margin-top: 40px;">Trivia Tower</h1>
        <div class="subtitle">Climb & Conquer</div>

        <div class="top-bar">
            <div>Level <span id="user-level">1</span></div>
            <div class="currency-display">🪙 <span id="coin-count">100</span></div>
        </div>

        <button class="btn" onclick="startGame()">▶ Play Game</button>
        <button class="btn btn-gold" onclick="watchAdForCoins()">🎬 Watch Ad (+100 Coins)</button>
        <button class="btn btn-secondary" onclick="alert('Categories: Science, Math, History, Coding!')">📚 Categories</button>
    </div>

    <!-- Gameplay Screen -->
    <div id="game-screen" class="screen">
        <div class="top-bar">
            <div>Score: <span id="score">0</span></div>
            <div class="currency-display">🪙 <span id="game-coins">100</span></div>
        </div>

        <div class="question-card" id="question-text">
            Loading question...
        </div>

        <div class="options-grid" id="options-container">
            <!-- Options dynamically added -->
        </div>
    </div>
</div>

<script>
    let score = 0;
    let coins = 100;
    let currentQuestionIndex = 0;

    const questions = [
        { q: "What is the capital of France?", options: ["London", "Berlin", "Paris", "Madrid"], answer: 2 },
        { q: "Which language runs in a web browser?", options: ["Java", "C", "Python", "JavaScript"], answer: 3 },
        { q: "What is 12 x 12?", options: ["144", "124", "148", "132"], answer: 0 },
        { q: "Which planet is known as the Red Planet?", options: ["Venus", "Mars", "Jupiter", "Saturn"], answer: 1 }
    ];

    function startGame() {
        score = 0;
        currentQuestionIndex = 0;
        document.getElementById('menu-screen').classList.remove('active');
        document.getElementById('game-screen').classList.add('active');
        loadQuestion();
    }

    function loadQuestion() {
        const qData = questions[currentQuestionIndex];
        document.getElementById('question-text').innerText = qData.q;
        const container = document.getElementById('options-container');
        container.innerHTML = '';

        qData.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(idx, btn);
            container.appendChild(btn);
        });
    }

    function checkAnswer(selectedIdx, btnElement) {
        const qData = questions[currentQuestionIndex];
        if (selectedIdx === qData.answer) {
            btnElement.classList.add('correct');
            score += 10;
            coins += 5;
            document.getElementById('score').innerText = score;
            document.getElementById('game-coins').innerText = coins;
            document.getElementById('coin-count').innerText = coins;
        } else {
            btnElement.classList.add('wrong');
        }

        setTimeout(() => {
            currentQuestionIndex = (currentQuestionIndex + 1) % questions.length;
            loadQuestion();
        }, 1000);
    }

    function watchAdForCoins() {
        alert("Simulating Rewarded Ad...\n\nAd Completed! +100 Coins rewarded.");
        coins += 100;
        document.getElementById('coin-count').innerText = coins;
        document.getElementById('game-coins').innerText = coins;
    }
</script>

</body>
</html>
